[workspace]
resolver = "2"
members = [
    "crates/lansher-core",
    "crates/lansher-store",
    "crates/lansher-server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
# الاختبارات أسرع قليلاً مع هذه الإعدادات، وبناء الإصدار يبقى كما هو.
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
